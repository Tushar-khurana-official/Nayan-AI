name: Build NayanAI APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd nayan-ai
          npm install

      - name: Make gradlew executable
        run: chmod +x nayan-ai/android/gradlew

      - name: Build Debug APK
        run: |
          cd nayan-ai/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NayanAI-debug
          path: nayan-ai/android/app/build/outputs/apk/debug/app-debug.apk